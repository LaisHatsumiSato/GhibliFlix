name: CI
on: 
  push:
    branches:
      - main
      - develop
  pull_request:
    branches: 
      - main
      - develop
jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Node config
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Rodando testes
        run: npm test
       - name: Buildando
        run: npm run build
